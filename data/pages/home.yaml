      publication:
        type: 预印本
        venue: arXiv 预印本
        year: "2026"
        authors: 李响
        title: GeoRouteNet：面向欧几里得 TSP 的几何增强神经求解器
        summary: 将几何归纳偏置注入节点、边与注意力表示，并采用多候选自比较强化学习训练的非自回归神经求解器。
        page_url: publications/georoutenet/
        paper_url: https://arxiv.org/abs/2606.22776
        code_url: https://github.com/stardustlil/GeoRouteNet
        image_alt: 带有 GeoRouteNet 实验结果标注的旅行商问题路线图
        results:
          - label: TSP50 差距
            value: 0.32%
          - label: TSP100 差距
            value: 1.26%
          - label: TSPLIB 差距
            value: 3.60%
      project:
        type: 独立项目
        title: poetryGPT：面向中文古诗生成的 Decoder-only Transformer
        summary: 使用 PyTorch 构建的字符级语言模型，覆盖数据清洗、Transformer 训练以及面向古诗词的可控自回归解码。
        code_url: https://github.com/stardustlil/poetryGPT
        image_alt: poetryGPT 生成的中文古诗排版样例
        facts:
          - 7 层 Transformer
          - 约 1400 万参数
          - 220 万字符训练语料
      portfolio_url: https://github.com/stardustlil?tab=repositories
      projects:
        - name: GeoRouteNet
          type: 研究代码
          language: Python
          summary: GeoRouteNet 论文的官方实现，包含几何增强神经求解器的训练、评测与解码代码。
          url: https://github.com/stardustlil/GeoRouteNet
          tags:
            - 神经组合优化
            - 强化学习
        - name: 408-local-judge
          type: 全栈应用
          language: Python
          summary: 面向 408 数据结构刷题的本地 Online Judge，使用 Docker 一次性沙箱逐测试点判题，支持 Markdown/KaTeX 题面与提交历史。
          url: https://github.com/stardustlil/408-local-judge
          tags:
            - FastAPI
            - React
            - Docker
        - name: errorbook-mcp
          type: MCP 服务
          language: Python
          summary: 本地优先的错题本 MCP 服务器，为 agent 提供结构化录题、FSRS 复习调度与优先级维护，并导出带数学公式的打印版 PDF。
          url: https://github.com/stardustlil/errorbook-mcp
          tags:
            - MCP
            - FSRS
            - SQLite
        - name: tsp_benchmark
          type: 实验框架
          language: Python
          summary: 插件化训练与基准框架，模型与训练策略均可插拔，统一训练入口与固定验证集，用于公平对比 TSP 神经求解器。
          url: https://github.com/stardustlil/tsp_benchmark
          tags:
            - Benchmark
            - 强化学习
        - name: Actor_Critic
          type: 强化学习
          language: Python
          summary: 面向离散动作空间的 Actor-Critic 实验框架，支持 A2C 与 QAC，采用统一 Agent 接口与注册式算法工厂。
          url: https://github.com/stardustlil/Actor_Critic
          tags:
            - A2C
            - QAC
        - name: flappy_bird_REINFORCE
          type: 强化学习
          language: Python
          summary: 使用 REINFORCE 算法（含 baseline 变体）训练 Flappy Bird 智能体的完整实现。
          url: https://github.com/stardustlil/flappy_bird_REINFORCE
          tags:
            - REINFORCE
            - 策略梯度
        - name: algorithm-templates
          type: 算法笔记
          language: C++
          summary: 算法竞赛与面试模板库，覆盖数据结构、动态规划、图论、数论与字符串的核心思路、推导和可复用模板。
          url: https://github.com/stardustlil/algorithm-templates
          tags:
            - 算法竞赛
            - 数据结构
      campus:
        period: 2022 - 2026
        organization: 长江大学 ICPC 集训队
        title: 程序设计竞赛训练
        summary: 系统训练动态规划、图论、计算几何、数论与字符串算法，强化算法建模和问题求解能力。

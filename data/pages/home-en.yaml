      publication:
        type: Preprint
        venue: arXiv preprint
        year: "2026"
        authors: Li Xiang
        title: 'GeoRouteNet: Geometry-Enhanced Neural Solver for Euclidean TSP'
        summary: A non-autoregressive neural solver that injects geometric inductive bias into node, edge, and attention representations, trained with multi-candidate self-comparison reinforcement learning.
        page_url: publications/georoutenet/
        paper_url: https://arxiv.org/abs/2606.22776
        code_url: https://github.com/stardustlil/GeoRouteNet
        image_alt: Geometric traveling salesman route with GeoRouteNet result annotations
        results:
          - label: TSP50 gap
            value: 0.32%
          - label: TSP100 gap
            value: 1.26%
          - label: TSPLIB gap
            value: 3.60%
      project:
        type: Independent project
        title: 'poetryGPT: Decoder-only Transformer for Chinese Poetry'
        summary: A character-level language model built in PyTorch, covering data cleaning, transformer training, and controllable autoregressive decoding for classical Chinese poetry.
        code_url: https://github.com/stardustlil/poetryGPT
        image_alt: Typeset sample of a classical Chinese poem generated by poetryGPT
        facts:
          - 7 transformer layers
          - Approximately 14M parameters
          - 2.2M-character training corpus
      portfolio_url: https://github.com/stardustlil?tab=repositories

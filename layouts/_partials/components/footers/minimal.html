{{/* Minimal footer: copyright/license line only. Brand attribution required by
     HugoBlox is rendered by the module's site_footer partial after this block. */}}
{{ $menu := .Site.Menus.footer }}
{{ with $menu }}
<nav class="flex flex-wrap justify-center gap-x-8 gap-y-2 py-2">
  {{ range . }}
  <a href="{{ .URL | relLangURL }}"
     {{ if findRE `^http` .URL }}target="_blank" rel="noopener"{{ end }}>
    {{ .Name }}
  </a>
  {{ end }}
</nav>
{{ end }}

{{ partial "site_footer_license" . }}
